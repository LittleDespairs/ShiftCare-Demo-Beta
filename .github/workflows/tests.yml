name: Tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedule_test
          POSTGRES_USER: schedule_app
          POSTGRES_PASSWORD: schedule_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedule_app -d schedule_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCHEDULE_APP_POSTGRES_TEST_DSN: postgresql://schedule_app:schedule_app@localhost:5432/schedule_test
      PYTHON_DOTENV_DISABLED: '1'
      SCHEDULE_APP_DISABLE_BACKGROUND_SYNC: '1'
      EMAIL_ENABLED: '0'
      DATABASE_ENGINE: sqlite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cloud.txt httpx

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q main.py shiftcare tests

  windows:
    runs-on: windows-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
      SCHEDULE_APP_DISABLE_BACKGROUND_SYNC: '1'
      EMAIL_ENABLED: '0'
      DATABASE_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-cloud.txt httpx
      - name: Run regression and packaging checks
        run: python -m unittest discover -s tests -v
